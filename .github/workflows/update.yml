name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    # macOS required for brew audit
    runs-on: macos-latest
    env:
      FORMULA: ${{ github.event.client_payload.formula }}
      REPO: ${{ github.event.client_payload.repo }}
      VERSION: ${{ github.event.client_payload.version }}
    steps:
      # Check out the live branch tip, not the (possibly stale) dispatch
      # commit, so reruns start from current main.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate payload
        run: |
          if [ -z "$FORMULA" ] || [ -z "$REPO" ] || [ -z "$VERSION" ]; then
            echo "::error::Missing required payload fields: formula='$FORMULA' repo='$REPO' version='$VERSION'"
            exit 1
          fi
          if [ ! -f "Formula/${FORMULA}.rb" ]; then
            echo "::error::Formula file Formula/${FORMULA}.rb not found"
            exit 1
          fi

      - name: Update formula version and checksum
        run: |
          URL="https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')

          FORMULA="$FORMULA" URL="$URL" SHA256="$SHA256" ruby -e '
            formula = ENV["FORMULA"]
            url = ENV["URL"]
            sha = ENV["SHA256"]
            path = "Formula/#{formula}.rb"
            content = File.read(path)
            content.sub!(/url "https:\/\/github\.com\/[^"]*\.tar\.gz"/, "url \"#{url}\"")
            content.sub!(/sha256 "[^"]*"/, "sha256 \"#{sha}\"")
            File.write(path, content)
          '

      - name: Run post_install tests
        run: ruby test_post_install.rb

      - name: Audit formula
        run: |
          brew update
          brew tap michaeldhopkins/tap
          # Homebrew 6.0 refuses to load formulae from untrusted third-party
          # taps; trust ours so `brew audit` can load it.
          brew trust michaeldhopkins/tap
          cp "Formula/${FORMULA}.rb" "$(brew --repo michaeldhopkins/tap)/Formula/${FORMULA}.rb"
          brew audit --strict "$FORMULA"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update ${FORMULA} to v${VERSION}"
          # This tap is shared by many formulae, each pushed by its own
          # repository_dispatch run. A bare push races: whoever pushes second
          # gets rejected (non-fast-forward) and, on rerun, keeps failing
          # because checkout is pinned to the stale dispatch commit. Rebase
          # onto the latest main and retry. Concurrent runs touch different
          # formula files, so the rebase never conflicts.
          for attempt in $(seq 1 5); do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto latest main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::failed to push ${FORMULA} after 5 attempts"
          exit 1
