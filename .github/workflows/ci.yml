name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run post_install tests
        run: ruby test_post_install.rb

  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Audit formulae
        run: |
          brew tap michaeldhopkins/tap
          # Homebrew 6.0 refuses to load formulae from untrusted third-party taps;
          # trust ours so `brew audit` can load it. update.yml got this in June and
          # this workflow did not — and CI has not run since, so the gap surfaced on
          # the next push and then failed on the FIRST formula alphabetically,
          # nowhere near the formula actually being changed.
          brew trust michaeldhopkins/tap
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            cp "$formula" "$(brew --repo michaeldhopkins/tap)/Formula/$name.rb"
            brew audit --strict "$name"
          done
